<header class="navbar card">
  <div class="brand">
    <button
      *ngIf="mostrarFlecha()"
      (click)="goBack()"
      class="back-button"
      title="Volver"
    >
      ←
    </button>
    <img src="assets/logo.png" alt="logo" class="logo" />
  </div>

  <nav class="nav-menu">
    <!-- ✅ ESTE *ngIf ES CRÍTICO -->
    <a 
      *ngIf="mostrarBotonAdmin()" 
      routerLink="/admin-login" 
      class="btn-admin"
    >
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        width="18" 
        height="18" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        class="shield-icon"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Administrador</span>
    </a>
  </nav>
</header>
