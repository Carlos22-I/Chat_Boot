<app-navbar></app-navbar>

<section class="login-section">
  <div class="login-card">

    <!-- Icono del Escudo -->
    <div class="shield-icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shield-icon">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
    </div>

    <h1 class="title">Panel de Administrador</h1>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <!-- Mensaje de Error -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" [formGroup]="loginForm" class="login-form">

      <!-- Usuario -->
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <input id="email" formControlName="email" placeholder="correo@unamba.edu.pe" class="app-input" type="email" />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contrasena</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input id="password" type="password" formControlName="password" placeholder="Ingresa tu contrasena"
            class="app-input" />
        </div>
      </div>

      <!-- Botón de Login -->
      <button type="submit" class="login-button" [disabled]="isLoading">
        <span *ngIf="!isLoading" class="button-content">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          Iniciar Sesión
        </span>
        <span *ngIf="isLoading" class="button-content">
          <div class="spinner"></div>
          Iniciando sesión...
        </span>
      </button>
    </form>



    <!-- Enlace de Registro -->
    <div class="register-section">
      <span class="register-text">¿No tienes una cuenta? </span>
      <button class="register-link" (click)="goRegister()">
        Regístrate aquí
      </button>
    </div>

  </div>
</section>
