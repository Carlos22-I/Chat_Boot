spring.application.name=tutorvirtual-backend
server.port=${PORT:8080}

# ===== DATASOURCE (SUPABASE - SESSION POOLER) =====
# El Session Pooler es necesario para redes IPv4 (Direct Connection requiere IPv6)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.abbggyhiwkrrasxjvvms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gDbp8GB69FRuDU4T}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== HIKARI (CONFIGURACIÓN PARA ARCHIVOS GRANDES) =====
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.validation-timeout=30000

# ===== SSL (SUPABASE OBLIGATORIO) =====
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# ===== JPA PROPIEDADES ADICIONALES =====
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== GEMINI =====
